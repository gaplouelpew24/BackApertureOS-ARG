                <div class="icon"></div>

            <span id="end2" style="display: none">(((((96 * 89 + 77) * 93 - 85) + 49) * 4) * 97) - 73</span>

  <script>
	const SECRET_KEY = 'MY_SECRET_KEY';
	const USED_CODES_KEY = 'used_codes';

    const need_almond_water = 166666666;
    
    function loadVariable(key, defaultValue) {
        const value = localStorage.getItem(key);
        return value !== null ? JSON.parse(value) : defaultValue;
    }

    function saveVariable(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
    }

    function release() {
        document.getElementById('endwindow').style = "display: flex;"
        setTimeout(() => {
            document.getElementById('end1').style = "display: block;";
        }, 500);
        setTimeout(() => {
            document.getElementById('end2').style = "display: block;";
            gameState.end = true;
        }, 1500);
    }

    const variables = {
        almond_water: 0,
        almond_water_click_level: 1,
        almond_water_click_upgrade_price: 10,
        buy_goldfinger: 0,
        goldfinger: false,
        goldfinger_price: 5000,
        goldfinger_time: 0,
        people: 0,
        people_price: 20,
        people_level: 1,
        people_upgrade_price: 50,
        buy_whip: 0,
        whip: false,
        whip_price: 20000,
        whip_time: 0,
        buy_monster: 0,
        monster: false,
        monster_price: 50000,
        monster_time: 0,
        buy_dice: 0,
        dice_price: 1000000,
        buy_rich: 0,
        rich_price: 88888888,
        initial: false,
        big_baodi: 0,
        end: false
    };

    const gameState = {};
    for (const [key, defaultValue] of Object.entries(variables)) {
        Object.defineProperty(gameState, key, {
            get: () => loadVariable(key, defaultValue),
            set: (value) => saveVariable(key, value)
        });
    }

    const max_find_level = 200;
    const max_goldfinger = 10;
    const max_people = 1000;
    const max_people_level = 50;
    const max_whip = 5;
    const max_monster = 20;
    const max_dice = 6;
    const max_rich = 1;
    let people_speed = 0;

    if (gameState.initial == false) {
        initial();
        gameState.initial = true;

        document.getElementById('warnwindow').style = "display: block;"
        document.getElementById('result').innerText = '欢迎游玩这个杏仁水游戏，你的任务目标就是灌满杏仁水瓶，点那个杏仁水瓶就能收集，嗯没了。';
    }

    function update(){
        document.getElementById('almond_water').style.setProperty('--expbar-startpoint', (gameState.almond_water / need_almond_water) * 100 + '%');
        document.getElementById('jszbuff').style.setProperty('--startpoint', 100 - (gameState.goldfinger_time / 60000) * 100 + '%');
        document.getElementById('bzbuff').style.setProperty('--startpoint', 100 - (gameState.whip_time / 120000) * 100 + '%');
        document.getElementById('gnylbuff').style.setProperty('--startpoint', 100 - (gameState.monster_time / 300000) * 100 + '%');
        people_speed = gameState.people *(1 + Math.pow((gameState.people_level - 1), 2) / 5);
        updateDisplay();
        cantbuy();
        buff();

        if (gameState.almond_water >= need_almond_water) document.getElementById('almond_water').className = "full";
    }

    function buff(){
        if (gameState.goldfinger == true && gameState.goldfinger_time > 0) {
            gameState.goldfinger_time --;
            document.getElementById('jszbuff').className = "open";
            document.getElementById('shop_goldfinger').className = "cantbuy buffa";
        }
        else if (gameState.goldfinger == true){
            gameState.goldfinger = false;
            document.getElementById('jszbuff').className = "";
            document.getElementById('shop_goldfinger').className = "";
        }

        if (gameState.whip == true && gameState.whip_time > 0) {
            gameState.whip_time --;
            document.getElementById('bzbuff').className = "open";
            document.getElementById('shop_bianzi').className = "cantbuy buffa";
        }
        else if (gameState.whip == true){
            gameState.whip = false;
            document.getElementById('bzbuff').className = "";
            document.getElementById('shop_bianzi').className = "";
        }

        if (gameState.monster == true && gameState.monster_time > 0) {
            gameState.monster_time --;
            document.getElementById('gnylbuff').className = "open";
            document.getElementById('shop_monster').className = "cantbuy buffa";
        }
        else if (gameState.monster == true){
            gameState.monster = false;
            document.getElementById('gnylbuff').className = "";
            document.getElementById('shop_monster').className = "";
        }
    }

    function initial() {
        for (const [key, defaultValue] of Object.entries(variables)) {
            if (key !== 'initial') {
                gameState[key] = defaultValue;
            }
        }
    }

    if (gameState.end) {
        document.getElementById('endwindow').style = "display: flex;"
        document.getElementById('end2').style = "display: block;";
    }

    function cantbuy() {
        if ((max_find_level - gameState.almond_water_click_level) <= 0) document.getElementById('shop_find').className = "cantbuy";
        if ((max_goldfinger - gameState.buy_goldfinger) <= 0) document.getElementById('shop_goldfinger').className = "cantbuy";
        if ((max_people - gameState.people) <= 0) document.getElementById('shop_people').className = "cantbuy";
        if ((max_people_level - gameState.people_level) <= 0) document.getElementById('shop_people_upgrade').className = "cantbuy";
        if ((max_whip - gameState.buy_whip) <= 0) document.getElementById('shop_bianzi').className = "cantbuy";
        if ((max_monster - gameState.buy_monster) <= 0) document.getElementById('shop_monster').className = "cantbuy";
        if ((max_dice - gameState.buy_dice) <= 0) document.getElementById('shop_dice').className = "cantbuy";
        if ((max_rich - gameState.buy_rich) <= 0) document.getElementById('shop_rich').className = "cantbuy";
    }

    function shopbuy(number) {
        if (number == 1) {
            if (gameState.almond_water_click_upgrade_price <= gameState.almond_water) {
                gameState.almond_water -= gameState.almond_water_click_upgrade_price;
                gameState.almond_water_click_level ++;
                gameState.almond_water_click_upgrade_price += Math.pow(gameState.almond_water_click_level, 3) / Math.pow(gameState.almond_water_click_level, 1.25) * Math.pow(gameState.almond_water_click_level, 0.25) * 20;
            }
            else {
                document.getElementById('shop_find').className = "cantbuy nomoney";
                setTimeout(() => {
                    document.getElementById('shop_find').className = "";
                }, 500);
            }
        }
        if (number == 2) {
            if (gameState.goldfinger_price <= gameState.almond_water) {
                gameState.almond_water -= gameState.goldfinger_price;
                gameState.buy_goldfinger ++;
                gameState.goldfinger_price *= 2.85;
                gameState.goldfinger = true;
                gameState.goldfinger_time = 60000;
            }
            else {
                document.getElementById('shop_goldfinger').className = "cantbuy nomoney";
                setTimeout(() => {
                    document.getElementById('shop_goldfinger').className = "";
                }, 500);
            }
            
        }
        if (number == 3) {
            if (gameState.people_price <= gameState.almond_water) {
                gameState.almond_water -= gameState.people_price;
                gameState.people ++;
                gameState.people_price += Math.pow(gameState.people + 1, 1.2) / Math.pow(gameState.people + 1, -0.25) * 10;
            }
            else {
                document.getElementById('shop_people').className = "cantbuy nomoney";
                setTimeout(() => {
                    document.getElementById('shop_people').className = "";
                }, 500);
            }
            
        }
        if (number == 4) {
            if (gameState.people_upgrade_price <= gameState.almond_water) {
                gameState.almond_water -= gameState.people_upgrade_price;
                gameState.people_level ++;
                gameState.people_upgrade_price += Math.pow(gameState.people_level, 3.1) * 40;
            }
            else {
                document.getElementById('shop_people_upgrade').className = "cantbuy nomoney";
                setTimeout(() => {
                    document.getElementById('shop_people_upgrade').className = "";
                }, 500);
            }
            
        }
        if (number == 5) {
            if (gameState.monster_price <= gameState.almond_water) {
                gameState.almond_water -= gameState.monster_price;
                gameState.buy_monster ++;
                gameState.monster_price *= 1.45;
                gameState.monster = true;
                gameState.monster_time = 300000;
            }
            else {
                document.getElementById('shop_monster').className = "cantbuy nomoney";
                setTimeout(() => {
                    document.getElementById('shop_monster').className = "";
                }, 500);
            }
            
        }
        if (number == 6) {
            if (gameState.whip_price <= gameState.almond_water) {
                gameState.almond_water -= gameState.whip_price;
                gameState.buy_whip ++;
                gameState.whip_price *= 7.5;
                gameState.whip = true;
                gameState.whip_time = 120000;
            }
            else {
                document.getElementById('shop_bianzi').className = "cantbuy nomoney";
                setTimeout(() => {
                    document.getElementById('shop_bianzi').className = "";
                }, 500);
            }
            
        }
        if (number == 7) {
            if (gameState.dice_price <= gameState.almond_water) {
                gameState.almond_water -= gameState.dice_price;
                gameState.buy_dice ++;
                gameState.dice_price *= 2;
                gameState.almond_water = randomMultiplyInRange(gameState.almond_water, 0.5, 1.5)
            }
            else {
                document.getElementById('shop_dice').className = "cantbuy nomoney";
                setTimeout(() => {
                    document.getElementById('shop_dice').className = "";
                }, 500);
            }
            
        }
        if (number == 8) {
            if (gameState.rich_price <= gameState.almond_water) {
                gameState.almond_water -= gameState.rich_price;
                gameState.buy_rich ++;
            }
            else {
                document.getElementById('shop_rich').className = "cantbuy nomoney";
                setTimeout(() => {
                    document.getElementById('shop_rich').className = "";
                }, 500);
            }
            
        }
    }

    function updateDisplay() {
        document.getElementById('almondnumber').innerText = (gameState.almond_water).toFixed(2);

        if (gameState.almond_water >= need_almond_water) document.getElementById('release').style = "display:block";

        if (gameState.almond_water >= need_almond_water) document.getElementById('almondwaternumber').innerText = "满了！！！";
        else document.getElementById('almondwaternumber').innerText = (gameState.almond_water).toFixed(2) + "/" + need_almond_water;

        document.getElementById('peoplenumber').innerText = gameState.people;

        if (gameState.goldfinger) document.getElementById('clickspeed').innerText = (Math.pow((gameState.almond_water_click_level), 1.7) * 2).toFixed(2) + "/下";
        else document.getElementById('clickspeed').innerText = Math.pow((gameState.almond_water_click_level), 1.7).toFixed(2) + "/下";
        
        if (gameState.whip && gameState.monster) document.getElementById('peoplespeed').innerText = (people_speed * 1.5 * 2).toFixed(2) + "/s";
        else if (gameState.whip) document.getElementById('peoplespeed').innerText = (people_speed * 2).toFixed(2) + "/s";
        else if (gameState.monster) document.getElementById('peoplespeed').innerText = (people_speed * 1.5).toFixed(2) + "/s";
        else document.getElementById('peoplespeed').innerText = (people_speed).toFixed(2) + "/s";
        
        document.getElementById('find_level').innerText = gameState.almond_water_click_level;
        document.getElementById('find_price').innerText = gameState.almond_water_click_upgrade_price.toFixed(0);
        
        document.getElementById('finger_level').innerText = (max_goldfinger - gameState.buy_goldfinger);
        document.getElementById('finger_price').innerText = gameState.goldfinger_price.toFixed(0);
        
        document.getElementById('people_count').innerText = (max_people - gameState.people);
        document.getElementById('people_price').innerText = gameState.people_price.toFixed(0);
        
        document.getElementById('people_level').innerText = gameState.people_level;
        document.getElementById('people_upgrade_price').innerText = gameState.people_upgrade_price.toFixed(0);
        
        document.getElementById('monster_count').innerText = (max_monster - gameState.buy_monster);
        document.getElementById('monster_price').innerText = gameState.monster_price.toFixed(0);
        
        document.getElementById('whip_count').innerText = (max_whip - gameState.buy_whip);
        document.getElementById('whip_price').innerText = gameState.whip_price.toFixed(0);
        
        document.getElementById('dice_count').innerText = (max_dice - gameState.buy_dice);
        document.getElementById('dice_price').innerText = gameState.dice_price.toFixed(0);
        
        document.getElementById('rich_count').innerText = (max_rich - gameState.buy_rich);
        document.getElementById('rich_price').innerText = gameState.rich_price.toFixed(0);
    }

    setInterval(update, 0);
    setInterval(get_almondwater, 10);

    function get_almondwater(){
        if (people_speed * 10 > 0) {
            if (gameState.whip && gameState.monster) gameState.almond_water += (people_speed / 100) * 1.5 * 2;
            else if (gameState.whip) gameState.almond_water += (people_speed / 100) * 2;
            else if (gameState.monster) gameState.almond_water += (people_speed / 100) * 1.5;
            else gameState.almond_water += (people_speed / 100);
        }
            
    }

    function openintroduce(content) {
        document.getElementById('introduce').className = "hover";
        document.getElementById('introduce').innerText = content;
    }

    function closeintroduce(content) {
        document.getElementById('introduce').className = "";
        document.getElementById('introduce').innerText = "";
    }

    function openShop() {
        document.getElementById('shopwindow').style = "display: block;"
    }

    function closeWindow() {
        document.getElementById('warnwindow').style = "display: none;"
        document.getElementById('shopwindow').style = "display: none;"
    }

    function almondWaterEvent() {
        const button = document.getElementById('almond_water');
        button.classList.add('shake');
        setTimeout(() => {
            button.classList.remove('shake');
        }, 100);

        if (gameState.goldfinger) gameState.almond_water += Math.pow((gameState.almond_water_click_level), 1.7) * 2;
        else gameState.almond_water += Math.pow((gameState.almond_water_click_level), 1.7);

        gameState.big_baodi ++;
        const randomNum = Math.floor(Math.random() * 5000) + 1;
        if (randomNum === 1 || gameState.big_baodi >= 10000) {
            generateCode();
            gameState.big_baodi = 0;
        }
    }
  
	function simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
        }
        return hash.toString(36).toUpperCase().slice(0, 10);
	}
  
	function getCurrentTimestamp() {
	    return Math.floor(Date.now() / 1000);
	}
  
	function generateCode() {
	    const timestamp = getCurrentTimestamp();
	    const raw = timestamp + SECRET_KEY;
	    const code = simpleHash(raw);
        document.getElementById('warnwindow').style = "display: block;"
  
        saveUsedCode(code);
        document.getElementById('result').innerText = `恭喜你获得神秘代码：${code}，当然吼你是用不了的，不如让别人试试？`;
	}
  
	function getUsedCodes() {
        const data = localStorage.getItem(USED_CODES_KEY);
        return data ? JSON.parse(data) : [];
	}
  
	function saveUsedCode(code) {
        const codes = getUsedCodes();
        codes.push(code);
        localStorage.setItem(USED_CODES_KEY, JSON.stringify(codes));
	}
  
	function isValidCode(code) {
        const now = getCurrentTimestamp();
        for (let i = 0; i < 86400; i++) {
            const raw = (now - i) + SECRET_KEY;
            if (simpleHash(raw) === code) {
            return true;
            }
        }
        return false;
	}

    function randomMultiplyInRange(value, minMultiplier, maxMultiplier) {
        const multiplier = minMultiplier + Math.random() * (maxMultiplier - minMultiplier);
        return value * multiplier;
    }
  
	function executeCode() {
	    const input = document.getElementById('inputCode').value.trim();
	    const usedCodes = getUsedCodes();
        document.getElementById('warnwindow').style = "display: block;"
  
        if (usedCodes.includes(input)) {
            document.getElementById('result').innerText = '我跟你说吼，这个码用不了了你气不气。';
        } else if (isValidCode(input)) {
            document.getElementById('result').innerText = `哇塞，居然是能用的码，那我不得不奖励你了。`;
            saveUsedCode(input);
            gameState.almond_water += randomMultiplyInRange(gameState.almond_water, 0.1, 0.5)
        } else if (input == "") {
            document.getElementById('result').innerText = `一点东西不往里输直接糊弄我是吧。`;
        } else {
            document.getElementById('result').innerText = '？你在往里输什么。';
        }
	}
  </script>
