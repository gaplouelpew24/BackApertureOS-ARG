document.addEventListener('keydown', function(e) {
  if (e.key.startsWith('F') && e.key.length > 1) {
    e.preventDefault();
    return false;
  }

  if (e.ctrlKey || e.altKey || e.metaKey) {
    e.preventDefault();
    return false;
  }

  const forbiddenKeys = [
    'Escape', 'Tab', 'PrintScreen', 
    'Insert', 'Delete', 'Pause'
  ];
  if (forbiddenKeys.includes(e.key)) {
    e.preventDefault();
    return false;
  }
});

    function handleHistory(historyArr, getIndex, setIndex) {
  return function(e) {
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      let idx = getIndex();
      if (historyArr.length === 0) return;
      if (idx < 0) {
        idx = historyArr.length;
      }
      idx = Math.max(0, idx - 1);
      setIndex(idx);
      this.value = historyArr[idx];
      this.setSelectionRange(this.value.length, this.value.length);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      let idx = getIndex();
      if (historyArr.length === 0) return;
      // 如果 historyIndex 尚未初始化或已经在最后，则清空
      if (idx < 0 || idx >= historyArr.length - 1) {
        idx = historyArr.length;
        this.value = '';
      } else {
        idx = Math.min(historyArr.length, idx + 1);
        if (idx === historyArr.length) {
          this.value = '';
        } else {
          this.value = historyArr[idx];
        }
      }
      setIndex(idx);
      this.setSelectionRange(this.value.length, this.value.length);
    }
  };
}
const historyArr = [];
let historyIndex = -1;

inputLine.addEventListener('keydown', function(e) {
  // 上下箭头翻阅历史
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();

    if (historyArr.length === 0) return;

    if (e.key === 'ArrowUp') {
      // 第一次按 ↑ 时，如果 index < 0，就先跳到最后一条
      if (historyIndex < 0) {
        historyIndex = historyArr.length;
      }
      historyIndex = Math.max(0, historyIndex - 1);
      this.value = historyArr[historyIndex];
    } else {
      // ↓ 键逻辑
      if (historyIndex < 0 || historyIndex >= historyArr.length - 1) {
        historyIndex = historyArr.length;
        this.value = '';
      } else {
        historyIndex = Math.min(historyArr.length, historyIndex + 1);
        this.value = historyArr[historyIndex] || '';
      }
    }

    this.setSelectionRange(this.value.length, this.value.length);
    return;
  }

  // 回车提交
  if (e.key === 'Enter') {
    const cmdText = this.value.trim();
    if (cmdText !== '') {
      // 保存到历史
      historyArr.push(cmdText);
      historyIndex = historyArr.length;
    }
  }
});

    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('inputLine');

      // 初始聚焦并选中文本
      input.focus();
      input.select();

      // 任何时候失去聚焦都重新聚焦
      input.addEventListener('blur', () => {
        setTimeout(() => {
          input.focus();
          input.select();
        }, 0);
      });

      // 每次获得焦点都选中文本
      input.addEventListener('focus', () => {
        input.select();
      });

      // 如果用户点击页面其它地方，也立刻将焦点拉回输入框
      document.addEventListener('mousedown', (e) => {
        // 如果点击目标不是输入框本身
        if (e.target !== input) {
          e.preventDefault();
          input.focus();
          input.select();
        }
      });

      // 同样防止鼠标滑动、右键等导致输入框失焦
      document.addEventListener('mouseup', (e) => {
        if (e.target !== input) {
          e.preventDefault();
          input.focus();
          input.select();
        }
      });
    });

    function saveData() {
      localStorage.setItem(DATA_KEY, JSON.stringify(myData));

    function slowPrint(text, callback = null, delay = 50) {
      const lines = text.split("\n");
      (function printNextLine(index) {
        if (index >= lines.length) {
          if (typeof callback === "function") {
            setTimeout(callback, delay);
          }
          return;
        }
        writeImmediate(lines[index]);
        setTimeout(() => printNextLine(index + 1), delay);
      })(0);
    }

    function writeImmediate(text) {
      const line = document.createElement("div");
      line.textContent = text;
      TERMINAL.appendChild(line);
      TERMINAL.scrollTop = TERMINAL.scrollHeight;
    }

    function clearScreen() {
      TERMINAL.innerHTML = "";

    function generateValidSerial() {
      const hexChars = "0123456789ABCDEF";
      function randomHexBlock() {
        let block = "";
        for (let i = 0; i < 4; i++) {
          block += hexChars[Math.floor(Math.random() * 16)];
        }
        return block;
      }

      const parts = [];
      for (let i = 0; i < 4; i++) {
        parts.push(randomHexBlock());
      }

      const mainPart = parts.join("-");
      const checksum = CryptoJS.MD5(mainPart)
        .toString(CryptoJS.enc.Hex)
        .substring(0, 4)
        .toUpperCase();

      return `${mainPart}-${checksum}`;
    }

    function decimalOffsetDecoder(encodedNumbers, offset, mode = 'subtract') {
      encodedNumbers = String(encodedNumbers);
      const decoded = [];

      const operation = (mode.toLowerCase() === 'add')
        ? (x, y) => x - y
        : (x, y) => x + y;

      for (let char of encodedNumbers) {
        if (!/^\d$/.test(char)) {
          decoded.push(char);
          continue;
        }

        const originalDigit = parseInt(char, 10);
        const raw = operation(originalDigit, offset);
        const decodedDigit = ((raw % 10) + 10) % 10;
        decoded.push(decodedDigit.toString());
      }

      return decoded.join('');
    }
